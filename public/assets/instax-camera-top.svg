<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <rect width="500" height="280" fill="#F8FAFC"/>
  <ellipse cx="250" cy="230" rx="140" ry="16" fill="#E2E8F0"/>
  <!-- Top View of Instax Camera with Film Eject Slot -->
  <g transform="translate(130, 60)">
    <rect width="240" height="140" rx="24" fill="#20346B" stroke="#101D3B" stroke-width="2.5"/>
    <!-- Film Ejection Slot -->
    <rect x="50" y="35" width="140" height="14" rx="7" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <!-- Film Sheet Ejecting -->
    <rect x="65" y="0" width="110" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="75" y="5" width="90" height="28" rx="2" fill="#38BDF8"/>
    <!-- Power Button & Shutter -->
    <circle cx="35" cy="95" r="14" fill="#FEE047" stroke="#101D3B" stroke-width="2"/>
    <circle cx="205" cy="95" r="12" fill="#475569" stroke="#101D3B" stroke-width="2"/>
    <text x="120" y="115" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle">FILM EJECT SLOT</text>
  </g>
</svg>