<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="50%" stopColor="#0F172A"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="innerShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <filter id="headbandGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="#F8FAFC"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="245" rx="180" ry="16" fill="#E2E8F0"/>

  <g filter="url(#headbandGlow)">
    <!-- Back Loop Inside -->
    <ellipse cx="250" cy="135" rx="175" ry="65" fill="none" stroke="url(#innerShade)" stroke-width="52"/>
    
    <!-- Silicone grip strip on inside (dotted) -->
    <ellipse cx="250" cy="135" rx="175" ry="65" fill="none" stroke="#64748B" stroke-width="3.5" stroke-dasharray="12 10" opacity="0.6"/>

    <!-- Front Loop Outside -->
    <path d="M75 135 C75 185 140 215 250 215 C360 215 425 185 425 135" fill="none" stroke="url(#bandGrad)" stroke-width="54" stroke-linecap="round"/>

    <!-- Dynamic Graphic Wave Print ("Black Print" model) -->
    <path d="M95 142 Q170 190 250 180 T405 142" fill="none" stroke="#FEE047" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M105 152 Q180 198 250 188 T395 152" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M115 162 Q185 204 250 196 T385 162" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Top & Bottom Edge Seam Stitches -->
    <path d="M78 112 C78 162 143 192 250 192 C357 192 422 162 422 112" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M78 158 C78 208 143 238 250 238 C357 238 422 208 422 158" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4"/>

    <!-- Center Brand Badge -->
    <g transform="translate(180, 168)">
      <rect x="0" y="0" width="140" height="32" rx="6" fill="#000000" stroke="#334155" stroke-width="1.5"/>
      <text x="70" y="21" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" letter-spacing="3" text-anchor="middle">DOMYOS</text>
    </g>
  </g>
</svg>
