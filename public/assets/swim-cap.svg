<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="capBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0F172A"/>
      <stop offset="60%" stopColor="#1E293B"/>
      <stop offset="100%" stopColor="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#475569" stopOpacity="0.8"/>
      <stop offset="100%" stopColor="#1E293B" stopOpacity="0"/>
    </linearGradient>
    <pattern id="meshHex" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M4 0 L8 2.5 L8 7.5 L4 10 L0 7.5 L0 2.5 Z" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
    </pattern>
    <filter id="capShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="#F8FAFC"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="245" rx="160" ry="16" fill="#E2E8F0"/>

  <!-- Swim Cap 3D Form -->
  <g filter="url(#capShadow)">
    <!-- Base Dome Form -->
    <path d="M120 200 C110 130 150 50 250 50 C350 50 390 130 380 200 C360 215 320 220 250 220 C180 220 140 215 120 200 Z" fill="url(#capBg)"/>
    <path d="M120 200 C110 130 150 50 250 50 C350 50 390 130 380 200 C360 215 320 220 250 220 C180 220 140 215 120 200 Z" fill="url(#meshHex)"/>

    <!-- Specular Crown Highlight -->
    <path d="M160 120 C160 80 200 65 250 65 C300 65 340 80 340 120 C300 100 200 100 160 120 Z" fill="url(#highlight)" opacity="0.6"/>

    <!-- Ergonomic Center Seam -->
    <path d="M250 50 C246 100 246 160 250 220" fill="none" stroke="#000000" stroke-width="3" opacity="0.6"/>
    <path d="M250 50 C246 100 246 160 250 220" fill="none" stroke="#FEE047" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Side Contour Overlock Seams -->
    <path d="M180 80 C175 125 178 175 185 212" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M320 80 C325 125 322 175 315 212" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Elastic Rim Ribbing (Comfort Hem) -->
    <path d="M118 200 C138 215 185 224 250 224 C315 224 362 215 382 200 L380 208 C360 222 315 230 250 230 C185 230 140 222 120 208 Z" fill="#020617"/>
    <path d="M125 204 C150 216 195 222 250 222 C305 222 350 216 375 204" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3"/>

    <!-- Decathlon / Nabaiji Athletic Print -->
    <g transform="translate(210, 145)">
      <!-- Wave Graphic -->
      <path d="M0 10 Q20 0 40 10 T80 10" fill="none" stroke="#FEE047" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 18 Q30 8 50 18 T90 18" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
      <text x="40" y="36" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">DECATHLON</text>
      <text x="40" y="47" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="1.5" text-anchor="middle">MESH COMFORT · 56-59 CM</text>
    </g>
  </g>
</svg>
