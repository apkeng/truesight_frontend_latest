<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="rollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <rect width="500" height="280" fill="#F8FAFC"/>
  <ellipse cx="250" cy="240" rx="160" ry="18" fill="#E2E8F0"/>
  <!-- Rolled Mat Cylinder -->
  <g transform="translate(80, 75)">
    <ellipse cx="320" cy="65" rx="24" ry="60" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="5" width="290" height="120" fill="url(#rollGrad)" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="30" cy="65" rx="24" ry="60" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Spiral Roll Interior -->
    <path d="M30 65 A18 45 0 0 1 30 25 A12 30 0 0 1 30 95 A6 15 0 0 1 30 55" fill="none" stroke="#FEE047" stroke-width="2"/>
    <!-- Carrying Straps with Buckles -->
    <rect x="80" y="3" width="20" height="124" rx="4" fill="url(#strapGrad)" stroke="#101D3B" stroke-width="1.5"/>
    <rect x="240" y="3" width="20" height="124" rx="4" fill="url(#strapGrad)" stroke="#101D3B" stroke-width="1.5"/>
    <!-- Shoulder Sling -->
    <path d="M90 3 C160 -40 180 -40 250 3" fill="none" stroke="#FEE047" stroke-width="10" stroke-linecap="round"/>
    <path d="M90 3 C160 -40 180 -40 250 3" fill="none" stroke="#101D3B" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Brand Tag -->
    <rect x="130" y="50" width="80" height="30" rx="4" fill="#0F172A" stroke="#FEE047" stroke-width="1"/>
    <text x="170" y="69" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">TRUESIGHTS</text>
  </g>
</svg>