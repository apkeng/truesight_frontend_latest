<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <pattern id="macroGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none" stroke="#334155" stroke-width="0.75"/>
      <circle cx="8" cy="8" r="2.5" fill="#1E293B" stroke="#475569" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="500" height="280" fill="url(#coreGlow)"/>
  <rect width="500" height="280" fill="url(#macroGrid)"/>
  <!-- Gold Center Mandalas -->
  <g transform="translate(250, 140)">
    <circle r="100" fill="none" stroke="#FEE047" stroke-width="2" stroke-dasharray="10 6"/>
    <circle r="70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <circle r="45" fill="#1E293B" stroke="#FEE047" stroke-width="3"/>
    <text x="0" y="-12" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">ALIGNMENT</text>
    <text x="0" y="8" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">45° GUIDE</text>
    <text x="0" y="24" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" text-anchor="middle">DUAL GRIP</text>
  </g>
</svg>