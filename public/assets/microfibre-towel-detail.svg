<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <pattern id="waffleTexture" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" rx="2" fill="#0284C7" stroke="#0369A1" stroke-width="1"/>
      <rect x="3" y="3" width="12" height="12" rx="1" fill="#38BDF8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="500" height="280" fill="url(#waffleTexture)"/>
  <!-- Feature Roundel -->
  <g transform="translate(250, 140)">
    <circle r="85" fill="#0F172A" stroke="#FEE047" stroke-width="3"/>
    <text x="0" y="-18" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">ULTRA COMPACT</text>
    <text x="0" y="6" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">42 x 55 CM</text>
    <text x="0" y="28" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ABSORBENT WAFFLE</text>
