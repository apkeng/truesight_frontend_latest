<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <rect width="500" height="280" fill="#0F172A"/>
  <g transform="translate(90, 40)">
    <rect width="320" height="200" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect width="320" height="40" rx="14" fill="#4338CA"/>
    <rect x="0" y="24" width="320" height="16" fill="#4338CA"/>
    <text x="20" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Select Appointment Slot</text>
    <!-- Slot Chips -->
    <rect x="25" y="60" width="85" height="36" rx="8" fill="#10B981"/>
    <text x="67" y="82" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Today 4 PM</text>
    <rect x="120" y="60" width="85" height="36" rx="8" fill="#312E81" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="162" y="82" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Today 6 PM</text>
    <rect x="215" y="60" width="85" height="36" rx="8" fill="#312E81" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="257" y="82" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tomorrow</text>
    <!-- Feature Check -->
    <circle cx="40" cy="145" r="12" fill="#FEE047"/>
    <text x="40" y="150" fill="#101D3B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">✓</text>
    <text x="65" y="150" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Direct WhatsApp / Calendar Link</text>
  </g>
</svg>