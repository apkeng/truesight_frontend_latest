<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <rect width="500" height="280" fill="#3B1F08"/>
  <!-- Close up Bounty Print -->
  <g transform="translate(120, 30)">
    <rect width="260" height="220" rx="10" fill="#F5E6CA" stroke="#5C3317" stroke-width="3"/>
    <text x="130" y="55" fill="#3D1E06" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" letter-spacing="6" text-anchor="middle">WANTED</text>
    <rect x="30" y="70" width="200" height="95" fill="#3D1E06" rx="4"/>
    <!-- Skull & Crossed Bones -->
    <circle cx="130" cy="112" r="22" fill="#FFFFFF"/>
    <rect x="116" y="126" width="28" height="12" rx="2" fill="#FFFFFF"/>
    <!-- Straw Hat -->
    <ellipse cx="130" cy="96" rx="26" ry="8" fill="#FEE047"/>
    <rect x="118" y="88" width="24" height="10" rx="3" fill="#DC2626"/>
    <text x="130" y="190" fill="#3D1E06" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" letter-spacing="2" text-anchor="middle">DEAD OR ALIVE</text>
  </g>
</svg>