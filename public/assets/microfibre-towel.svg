<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="towelCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0EA5E9"/>
      <stop offset="45%" stopColor="#0284C7"/>
      <stop offset="100%" stopColor="#0369A1"/>
    </linearGradient>
    <linearGradient id="towelFold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="100%" stopColor="#0284C7"/>
    </linearGradient>
    <pattern id="waffleGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="none" stroke="#7DD3FC" stroke-width="0.8" opacity="0.35"/>
      <circle cx="5" cy="5" r="1.5" fill="#38BDF8" opacity="0.3"/>
    </pattern>
    <filter id="towelShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0369A1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="#F8FAFC"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="245" rx="175" ry="16" fill="#E2E8F0"/>

  <g filter="url(#towelShadow)">
    <!-- Bottom Stack Layer -->
    <rect x="70" y="90" width="360" height="130" rx="16" fill="#075985"/>
    <rect x="70" y="90" width="360" height="130" rx="16" fill="url(#waffleGrid)"/>
    <rect x="75" y="95" width="350" height="120" rx="12" fill="none" stroke="#FEE047" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>

    <!-- Main Folded Top Layer -->
    <rect x="85" y="65" width="330" height="135" rx="16" fill="url(#towelCyan)"/>
    <rect x="85" y="65" width="330" height="135" rx="16" fill="url(#waffleGrid)"/>

    <!-- Overlock Stitch Border (TrueSights Yellow Accented) -->
    <rect x="92" y="72" width="316" height="121" rx="12" fill="none" stroke="#FEE047" stroke-width="2.5" stroke-dasharray="6 4"/>

    <!-- Realistic Corner Fold Flap -->
    <path d="M335 65 L415 145 L415 65 Z" fill="#0369A1" opacity="0.4"/>
    <path d="M335 65 C365 95 385 115 415 145 C415 115 415 85 415 65 Z" fill="url(#towelFold)"/>
    <path d="M335 65 L415 145" stroke="#FEE047" stroke-width="2.5" stroke-dasharray="6 4"/>

    <!-- Nabaiji Woven Brand Tag (Stitched on corner) -->
    <g transform="translate(115, 120)">
      <rect x="0" y="0" width="105" height="34" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <rect x="3" y="3" width="99" height="28" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="3 2"/>
      <text x="52" y="18" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle">NABAIJI</text>
      <text x="52" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle">MICROFIBRE &#8226; SIZE S</text>
    </g>

    <!-- Absorbent Feature Tag -->
    <g transform="translate(260, 125)">
      <rect x="0" y="0" width="125" height="26" rx="13" fill="#FFFFFF" opacity="0.92" stroke="#BAE6FD" stroke-width="1"/>
      <circle cx="14" cy="13" r="6" fill="#0284C7"/>
      <path d="M12 13 L14 15 L17 11" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="70" y="17" fill="#0369A1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">QUICK DRY 15 MIN</text>
    </g>
  </g>
</svg>
