<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="matBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="40%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEE047"/>
      <stop offset="50%" stopColor="#E2E8F0"/>
      <stop offset="100%" stopColor="#FEE047"/>
    </linearGradient>
    <pattern id="gripTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.85" fill="#475569" opacity="0.4"/>
    </pattern>
    <filter id="matShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Mat Surface with rounded corners -->
  <rect width="500" height="280" fill="url(#matBg)"/>
  <rect width="500" height="280" fill="url(#gripTexture)"/>

  <!-- Decorative Outer Border -->
  <rect x="15" y="15" width="470" height="250" rx="8" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <rect x="22" y="22" width="456" height="236" rx="6" fill="none" stroke="#94A3B8" stroke-width="0.75" opacity="0.4"/>

  <!-- Center Mandala Art (Faithful to Reference Screen) -->
  <g transform="translate(250, 140)" opacity="0.85">
    <!-- Outer Sacred Geometry Rays -->
    <g stroke="url(#foilGrad)" stroke-width="1.2" fill="none">
      <circle r="110" stroke-dasharray="4 6"/>
      <circle r="95" stroke-dasharray="2 3"/>
      <circle r="75"/>
      <circle r="55"/>
      <circle r="35"/>
      <circle r="18" fill="#1E293B"/>
    </g>

    <!-- 16-Point Mandala Petals -->
    <g fill="#E2E8F0" opacity="0.75">
      <path d="M0 -75 C10 -55 25 -40 25 -25 C25 -10 10 0 0 0 C-10 0 -25 -10 -25 -25 C-25 -40 -10 -55 0 -75 Z"/>
      <path d="M0 75 C10 55 25 40 25 25 C25 10 10 0 0 0 C-10 0 -25 10 -25 25 C-25 40 -10 55 0 75 Z"/>
      <path d="M-75 0 C-55 10 -40 25 -25 25 C-10 25 0 10 0 0 C0 -10 -10 -25 -25 -25 C-40 -25 -55 -10 -75 0 Z"/>
      <path d="M75 0 C55 10 40 25 25 25 C10 25 0 10 0 0 C0 -10 10 -25 25 -25 C40 -25 55 -10 75 0 Z"/>
    </g>

    <g fill="none" stroke="#FEE047" stroke-width="1.5" opacity="0.8">
      <path d="M0 -90 L12 -65 L35 -65 L20 -45 L30 -20 L8 -30 L0 0 L-8 -30 L-30 -20 L-20 -45 L-35 -65 L-12 -65 Z" transform="rotate(45)"/>
      <path d="M0 -90 L12 -65 L35 -65 L20 -45 L30 -20 L8 -30 L0 0 L-8 -30 L-30 -20 L-20 -45 L-35 -65 L-12 -65 Z" transform="rotate(135)"/>
      <path d="M0 -90 L12 -65 L35 -65 L20 -45 L30 -20 L8 -30 L0 0 L-8 -30 L-30 -20 L-20 -45 L-35 -65 L-12 -65 Z" transform="rotate(225)"/>
      <path d="M0 -90 L12 -65 L35 -65 L20 -45 L30 -20 L8 -30 L0 0 L-8 -30 L-30 -20 L-20 -45 L-35 -65 L-12 -65 Z" transform="rotate(315)"/>
    </g>

    <!-- Center Lotus Core -->
    <circle r="12" fill="#FEE047"/>
    <circle r="6" fill="#1E293B"/>
    <circle r="3" fill="#FFFFFF"/>
  </g>

  <!-- Dual Alignment Lines for Asana Precision -->
  <line x1="40" y1="140" x2="135" y2="140" stroke="#94A3B8" stroke-width="1" stroke-dasharray="8 6" opacity="0.5"/>
  <line x1="365" y1="140" x2="460" y2="140" stroke="#94A3B8" stroke-width="1" stroke-dasharray="8 6" opacity="0.5"/>
  <circle cx="90" cy="140" r="14" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.4"/>
  <circle cx="410" cy="140" r="14" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.4"/>

  <!-- Brand Signature -->
  <text x="250" y="255" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="3" text-anchor="middle" opacity="0.6">TRUESIGHTS PRO FITNESS &#8226; 6MM ECO FOAM</text>
</svg>
