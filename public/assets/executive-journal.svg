<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="leatherNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="50%" stopColor="#0F172A"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="brassPen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#CA8A04"/>
      <stop offset="40%" stopColor="#FEE047"/>
      <stop offset="70%" stopColor="#FEF08A"/>
      <stop offset="100%" stopColor="#A16207"/>
    </linearGradient>
    <linearGradient id="pageEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FEF3C7"/>
      <stop offset="100%" stopColor="#FDE68A"/>
    </linearGradient>
    <filter id="journalShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="8" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="#F8FAFC"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="245" rx="175" ry="16" fill="#E2E8F0"/>

  <g filter="url(#journalShadow)" transform="translate(130, 20)">
    <!-- Gilded Book Pages Edge (Right & Bottom) -->
    <rect x="18" y="10" width="195" height="225" rx="10" fill="url(#pageEdge)"/>
    <line x1="210" y1="20" x2="210" y2="225" stroke="#D97706" stroke-width="1.5" stroke-dasharray="1 1"/>

    <!-- Hardbound Lay-Flat Cover -->
    <rect x="0" y="0" width="200" height="235" rx="12" fill="url(#leatherNavy)" stroke="#334155" stroke-width="2"/>

    <!-- Leather Spine Crease -->
    <rect x="0" y="0" width="26" height="235" rx="4" fill="#0A0F1D"/>
    <line x1="26" y1="0" x2="26" y2="235" stroke="#334155" stroke-width="2"/>
    <line x1="28" y1="0" x2="28" y2="235" stroke="#000000" stroke-width="1"/>

    <!-- Perimeter Stitching in Gold Thread -->
    <rect x="35" y="8" width="156" height="219" rx="8" fill="none" stroke="#FEE047" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.8"/>

    <!-- TrueSights Gold Foil Embossed Crest -->
    <g transform="translate(113, 100)">
      <circle r="36" fill="none" stroke="#FEE047" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#FEE047" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Eagle / Vision Diamond Symbol -->
      <polygon points="0,-18 14,-4 0,10 -14,-4" fill="#FEE047"/>
      <polygon points="0,0 8,16 0,22 -8,16" fill="#FEE047"/>
      <text x="0" y="48" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" letter-spacing="3" text-anchor="middle">TRUESIGHTS</text>
      <text x="0" y="58" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" letter-spacing="2" text-anchor="middle">EXECUTIVE DIARY</text>
    </g>

    <!-- Silk Bookmark Ribbon Ejecting from bottom -->
    <path d="M120 235 L120 262 L128 254 L136 262 L136 235 Z" fill="#FEE047"/>

    <!-- Elastic Pen Holder Loop on the side -->
    <rect x="196" y="85" width="12" height="60" rx="3" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>

    <!-- Luxury Gold Brass Ballpoint Pen Clamped Beside Journal -->
    <g transform="translate(202, 60)">
      <!-- Pen Body -->
      <rect x="0" y="0" width="10" height="135" rx="5" fill="url(#brassPen)" stroke="#A16207" stroke-width="1"/>
      <!-- Pen Tip Cone -->
      <polygon points="0,135 10,135 5,148" fill="#78350F"/>
      <!-- Gold Clip -->
      <rect x="-3" y="15" width="4" height="42" rx="2" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.8"/>
      <!-- Pen Ring Band -->
      <rect x="0" y="65" width="10" height="3" fill="#000000"/>
    </g>
  </g>
</svg>
