<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="50%" stopColor="#0F172A"/>
      <stop offset="100%" stopColor="#172554"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A"/>
      <stop offset="50%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#B45309"/>
    </linearGradient>
    <filter id="voucherShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="#F8FAFC"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="245" rx="180" ry="16" fill="#E2E8F0"/>

  <g filter="url(#voucherShadow)" transform="translate(75, 40)">
    <!-- Credit Card Sized Gift Card Form (350 x 200) -->
    <rect x="0" y="0" width="350" height="195" rx="16" fill="url(#cardNavy)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Subtle Diagonal Background Security Waves -->
    <path d="M0 80 Q175 40 350 110" fill="none" stroke="#FEE047" stroke-width="1" opacity="0.25"/>
    <path d="M0 120 Q175 80 350 150" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.2"/>

    <!-- EMV Gold Smart Chip -->
    <g transform="translate(32, 42)">
      <rect x="0" y="0" width="46" height="36" rx="6" fill="url(#goldChip)" stroke="#92400E" stroke-width="1"/>
      <line x1="15" y1="0" x2="15" y2="36" stroke="#78350F" stroke-width="0.8"/>
      <line x1="31" y1="0" x2="31" y2="36" stroke="#78350F" stroke-width="0.8"/>
      <line x1="0" y1="18" x2="46" y2="18" stroke="#78350F" stroke-width="0.8"/>
    </g>

    <!-- Contactless Payment Wave Icon -->
    <g transform="translate(90, 48)" stroke="#E2E8F0" stroke-width="2" fill="none" opacity="0.8">
      <path d="M0 6 C2 10 2 16 0 20" stroke-linecap="round"/>
      <path d="M5 2 C8 9 8 23 5 30" stroke-linecap="round"/>
      <path d="M10 0 C15 8 15 26 10 34" stroke-linecap="round"/>
    </g>

    <!-- Top Right Brand & Voucher Label -->
    <text x="320" y="44" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" letter-spacing="3" text-anchor="end">TRUESIGHTS</text>
    <text x="320" y="58" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="end">CAMPUS BOOKSTORE E-CARD</text>

    <!-- Big Denomination (500 INR) -->
    <g transform="translate(32, 130)">
      <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" letter-spacing="2">CARD VALUE</text>
      <text x="0" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" letter-spacing="-1">₹500 <tspan font-size="16" fill="#FEE047" font-weight="800">INR</tspan></text>
    </g>

    <!-- Cardholder & Validity (Bottom Right) -->
    <g transform="translate(320, 142)">
      <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1" text-anchor="end">VALID ON CAMPUS</text>
      <text x="0" y="16" fill="#E2E8F0" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2" text-anchor="end">TS-BK-2026-9481</text>
    </g>
  </g>
</svg>
