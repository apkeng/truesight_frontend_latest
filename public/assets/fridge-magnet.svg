<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FEF3C7"/>
      <stop offset="50%" stopColor="#FDE68A"/>
      <stop offset="100%" stopColor="#FCD34D"/>
    </linearGradient>
    <linearGradient id="acrylicBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.8"/>
      <stop offset="50%" stopColor="#FFFFFF" stopOpacity="0"/>
      <stop offset="100%" stopColor="#1E293B" stopOpacity="0.4"/>
    </linearGradient>
    <filter id="magnetDrop" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="6" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="#F8FAFC"/>

  <!-- Refrigerator Surface Texture with Brushed Lines -->
  <line x1="20" y1="60" x2="480" y2="60" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="20" y1="140" x2="480" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="20" y1="220" x2="480" y2="220" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Thick Acrylic Collectible Magnet with Beveled Edge -->
  <g filter="url(#magnetDrop)" transform="translate(160, 20)">
    <!-- Magnet Backing Shadow (Neodymium) -->
    <rect x="-4" y="-4" width="188" height="248" rx="14" fill="#0F172A" opacity="0.6"/>

    <!-- Main Acrylic Slab -->
    <rect x="0" y="0" width="180" height="240" rx="10" fill="url(#parchment)" stroke="#B45309" stroke-width="2.5"/>

    <!-- Wanted Poster Header -->
    <text x="90" y="32" fill="#78350F" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" letter-spacing="4" text-anchor="middle">WANTED</text>

    <!-- Character Frame -->
    <rect x="18" y="42" width="144" height="120" rx="4" fill="#FEF9C3" stroke="#92400E" stroke-width="2"/>

    <!-- Straw Hat Luffy Silhouette Graphic -->
    <g transform="translate(90, 105)">
      <!-- Straw Hat Rim -->
      <ellipse cx="0" cy="-22" rx="45" ry="12" fill="#FBBF24" stroke="#B45309" stroke-width="2"/>
      <ellipse cx="0" cy="-22" rx="28" ry="7" fill="#DC2626"/>
      <path d="M-22 -22 C-22 -40 22 -40 22 -22 Z" fill="#FBBF24" stroke="#B45309" stroke-width="2"/>

      <!-- Luffy Hair & Grin Silhouette -->
      <circle cx="0" cy="2" r="22" fill="#1C1917"/>
      <!-- Characteristic Smile -->
      <path d="M-12 5 Q0 16 12 5" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
      <!-- Eye scar -->
      <path d="M-8 -2 L-6 2" stroke="#DC2626" stroke-width="2"/>
    </g>

    <!-- DEAD OR ALIVE Stamp -->
    <text x="90" y="180" fill="#92400E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" letter-spacing="2" text-anchor="middle">DEAD OR ALIVE</text>

    <!-- Character Name -->
    <text x="90" y="202" fill="#78350F" font-family="'Impact', sans-serif" font-size="16" letter-spacing="1" text-anchor="middle">MONKEY·D·LUFFY</text>

    <!-- Bounty Berries -->
    <text x="90" y="222" fill="#B45309" font-family="'Impact', sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">3,000,000,000-</text>

    <!-- Glossy Acrylic Specular Sheen (Diagonal Glare) -->
    <path d="M0 0 L180 0 L180 40 L0 160 Z" fill="url(#acrylicBevel)" opacity="0.6"/>
  </g>
</svg>
