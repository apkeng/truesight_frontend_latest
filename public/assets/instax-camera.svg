<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="50%" stopColor="#0F172A"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#94A3B8"/>
      <stop offset="50%" stopColor="#E2E8F0"/>
      <stop offset="100%" stopColor="#475569"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0369A1"/>
      <stop offset="50%" stopColor="#0284C7"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <filter id="camShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="500" height="280" fill="#F8FAFC"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="245" rx="160" ry="16" fill="#E2E8F0"/>

  <!-- Camera Body -->
  <g filter="url(#camShadow)" transform="translate(140, 25)">
    <!-- Instant Photo Ejecting from Top Slot -->
    <g transform="translate(60, -10)">
      <rect x="0" y="0" width="100" height="60" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Photo Area with Campus Milestone -->
      <rect x="8" y="8" width="84" height="40" rx="2" fill="#0284C7"/>
      <circle cx="50" cy="24" r="10" fill="#FEE047"/>
      <path d="M12 44 L35 28 L55 40 L70 30 L88 44 Z" fill="#0369A1"/>
    </g>

    <!-- Main Chassis -->
    <rect x="0" y="25" width="220" height="185" rx="26" fill="url(#bodyGrad)" stroke="#334155" stroke-width="2"/>

    <!-- Left Grip Texture -->
    <rect x="12" y="55" width="28" height="125" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>

    <!-- Viewfinder Window (Top Left) -->
    <rect x="25" y="38" width="18" height="14" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="34" cy="45" r="3" fill="#FFFFFF" opacity="0.8"/>

    <!-- Flash Strobe (Top Right) -->
    <rect x="160" y="36" width="34" height="18" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="164" y="40" width="26" height="10" rx="2" fill="#FEF08A"/>

    <!-- Shutter Button (TrueSights Yellow) -->
    <circle cx="48" cy="45" r="9" fill="#FEE047" stroke="#CA8A04" stroke-width="1.5"/>
    <circle cx="48" cy="45" r="5" fill="#FEF08A"/>

    <!-- Giant 60mm Instax Lens Assembly (Center) -->
    <g transform="translate(118, 122)">
      <!-- Outer Bevel Ring -->
      <circle r="60" fill="url(#lensRing)"/>
      <circle r="52" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <!-- Stepped Inner Barrel -->
      <circle r="44" fill="#1E293B"/>
      <!-- Optical Glass Element -->
      <circle r="36" fill="url(#lensGlass)"/>
      <!-- Lens Reflections -->
      <ellipse cx="-10" cy="-12" rx="14" ry="7" fill="#FFFFFF" opacity="0.45" transform="rotate(-30, -10, -12)"/>
      <circle cx="16" cy="14" r="5" fill="#38BDF8" opacity="0.6"/>

      <!-- Selfie Mirror -->
      <circle cx="32" cy="-28" r="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
      <ellipse cx="30" cy="-30" rx="3" ry="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Fujifilm Branding -->
    <text x="118" y="48" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="3" text-anchor="middle">FUJIFILM</text>
    <text x="118" y="196" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="2" text-anchor="middle">instax mini &#8226; 60mm</text>
  </g>
</svg>
