      <rect x="22" y="0" width="8" height="50"/>
      <rect x="34" y="0" width="4" height="50"/>
      <rect x="42" y="0" width="2" height="50"/>
      <rect x="48" y="0" width="6" height="50"/>
      <rect x="58" y="0" width="4" height="50"/>
      <rect x="66" y="0" width="8" height="50"/>
      <rect x="78" y="0" width="2" height="50"/>
      <rect x="84" y="0" width="6" height="50"/>
