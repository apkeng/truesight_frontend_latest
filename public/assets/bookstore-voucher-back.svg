    <text x="267" y="110" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">TS-8941-K</text>
    <text x="175" y="160" fill="#FEE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">AUTHORIZED FOR REFERENCE TEXTBOOKS</text>
